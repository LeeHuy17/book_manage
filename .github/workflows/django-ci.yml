name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải mã nguồn từ Repo xuống máy ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Thiết lập môi trường Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Bước 3: Cài đặt thư viện (Chạy trực tiếp ở thư mục gốc Repo)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Bước 4: Chạy kiểm tra hệ thống (Chạy trực tiếp ở thư mục gốc Repo)
    - name: Run Tests
      run: |
        python manage.py test