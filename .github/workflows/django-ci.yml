name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Tải mã nguồn
    - name: Checkout code
      uses: actions/checkout@v4

    # Bước 2: Khởi tạo Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Bước 3: Cài đặt thư viện (Ép đứng sẵn trong book_manage)
    - name: Install Dependencies
      working-directory: ./book_manage
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Bước 4: Chạy Tests (Ép đứng sẵn trong book_manage)
    - name: Run Tests
      working-directory: ./book_manage
      run: |
        python manage.py test